name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*" # Triggers on tags like v0.0.1

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # IMPORTANT: These permissions are strictly required for OIDC Trusted Publishing
    permissions:
      id-token: write 
      contents: read 
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Extract version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Update pyproject.toml version
        run: |
          sed -i "s/^version =.*/version = \"${VERSION#v}\"/" pyproject.toml

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel
          pip install -r requirements.txt
          # Removed twine as it is no longer needed

      - name: Build package
        run: python -m build

      - name: Sign the distributions
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          echo "$GPG_SIGNING_KEY" | gpg --import
          gpg --detach-sign --armor dist/*.tar.gz
          gpg --detach-sign --armor dist/*.whl

      - name: Publish to PyPI
        # Replaces twine upload; automatically handles OIDC auth and PEP 740 provenance
        uses: pypa/gh-action-pypi-publish@release/v1
